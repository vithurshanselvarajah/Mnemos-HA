[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mnemos-ha"
version = "1.0.0"
description = "Home Assistant integration for the Mnemos face-recognition backend"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "Vithurshan Selvarajah" },
]
dependencies = [
    "aiohttp>=3.9.0,<4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-aiohttp>=1.0",
    "aiohttp>=3.9.0",
    "homeassistant>=2025.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["custom_components.mnemos"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-ra", "-q"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
